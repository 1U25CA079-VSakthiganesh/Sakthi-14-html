<!DOCTYPE html>
<html>
<head>
    <title>Absolute Positioning</title>

    <style>
        body {
            position: relative;
        }

        aside {
            position: absolute;
            right: 30px;
            top: 50px;
            padding: 20px;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <h1>Absolute Positioning Example</h1>

    <aside>
        Enter to win a free ticket!
    </aside>

</body>
</html>
